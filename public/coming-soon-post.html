<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OctaBitLogics – Coming Soon Post Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oxanium:wght@700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image-more/3.1.6/dom-to-image-more.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #e8eaf0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px 60px;
      font-family: 'Inter', sans-serif;
      gap: 32px;
    }

    h1.page-title {
      font-family: 'Oxanium', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: #002046;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* ─── POST CANVAS (1080 × 1350 = 4:5, scaled for screen) ─── */
    .post-scaling-container {
      width: 480px;     /* display scale */
      height: 600px;    /* 480 × (5/4) */
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      background: #fff;
    }

    .post-scaling-inner {
      transform: scale(0.44444444);
      transform-origin: top left;
      width: 1080px;
      height: 1350px;
    }

    #post {
      width: 1080px;    /* real export size */
      height: 1350px;
      position: relative;
      background-color: #ffffff;
      background-image: radial-gradient(rgba(0, 32, 70, 0.10) 1.5px, transparent 1.5px);
      background-size: 34px 34px;
      display: flex;
      flex-direction: column;
      align-items: flex-end; 
      justify-content: space-between;
      text-align: right;
      padding: 120px 100px;
      overflow: hidden;
    }

    /* Ambient blobs */
    #post::before {
      content: '';
      position: absolute;
      top: -15%;
      right: -10%;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(46, 204, 64, 0.16) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
    }

    #post::after {
      content: '';
      position: absolute;
      bottom: -10%;
      left: -5%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0, 32, 70, 0.10) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
    }

    /* Top Logo */
    .post-logo-container {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      justify-content: flex-end;
    }
    
    .post-logo {
      width: 450px;
      height: auto;
      object-fit: contain;
    }

    /* "COMING SOON" — gradient */
    .post-coming {
      position: relative;
      z-index: 2;
      font-family: 'Oxanium', monospace;
      font-size: 210px; /* Big text */
      font-weight: 900;
      line-height: 0.88;
      text-transform: uppercase;
      background: linear-gradient(135deg, #002046 0%, #013a6b 35%, #0a5c50 70%, #1a8a60 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Tagline */
    .post-tagline {
      position: relative;
      z-index: 2;
      font-family: 'Inter', sans-serif;
      font-size: 34px;
      font-weight: 500;
      color: #74777f;
      letter-spacing: 0.02em;
      margin-bottom: 16px;
    }

    /* ─── DOWNLOAD BUTTON ─── */
    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 36px;
      background: linear-gradient(135deg, #002046 0%, #1a8a60 100%);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .download-btn:hover { opacity: 0.88; }
    .download-btn:active { opacity: 0.75; }
    .note { font-size: 0.75rem; color: #888; text-align: center; }
  </style>
</head>

  <p class="note">Opens a high-resolution 1080 × 1350 px PNG — ready for Instagram.</p>

  <script>
    async function exportPNG() {
      const btn = document.querySelector('.download-btn');
      btn.textContent = 'Generating…';
      btn.disabled = true;

      const el = document.getElementById('post');
      
      try {
        const dataUrl = await domtoimage.toPng(el, {
          width: 1080,
          height: 1350,
          bgcolor: '#ffffff',
          style: {
            transform: 'none',
            transformOrigin: 'top left',
            margin: '0',
            left: '0',
            top: '0'
          }
        });

        const link = document.createElement('a');
        link.download = 'OctaBitLogics_ComingSoon.png';
        link.href = dataUrl;
        link.click();
      } catch (error) {
        console.error('Export failed:', error);
        alert("Export failed. Please check the console.");
      }

      btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Export as PNG (1080 × 1350)`;
      btn.disabled = false;
    }
  </script>
